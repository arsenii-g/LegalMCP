[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalmcp"
version = "0.2.0"
description = "Servidor MCP local de derecho tributario español: normativa consolidada del BOE con historial de versiones, doctrina DGT y TEAC, y calculadoras de plazos, prescripción, sanciones, recargos e intereses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "requests>=2.31",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
legalmcp = "normativa_mcp.server:main"
legalmcp-ingest = "normativa_mcp.ingest:main"

[tool.setuptools]
packages = ["normativa_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
